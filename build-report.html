<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>devbox Build Graph Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #0f172a;
      --line: #cbd5e1;
      --accent: #0ea5e9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top right, #e2e8f0, var(--bg));
      color: var(--ink);
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 14px;
      min-height: 100vh;
      padding: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
    }
    .title {
      margin: 0 0 10px;
      font-size: 18px;
      letter-spacing: 0.2px;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 14px;
    }
    .stat strong {
      color: var(--accent);
    }
    .list {
      margin: 8px 0 0;
      padding-left: 16px;
      font-size: 13px;
      line-height: 1.4;
    }
    .graph-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      min-height: 72vh;
    }
    .legend {
      position: absolute;
      right: 10px;
      top: 10px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
    }
    .chip {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: middle;
    }
    #graph {
      width: 100%;
      height: 100%;
      min-height: 72vh;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      cursor: grab;
    }
    #graph.dragging { cursor: grabbing; }
    .node-label {
      font-size: 12px;
      fill: #0f172a;
      pointer-events: none;
    }
    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .graph-wrap {
        min-height: 60vh;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <h1 class="title">Build Analyzer Report</h1>
      <div class="stat"><span>Targets</span><strong id="targets"></strong></div>

      <div class="stat"><span>Critical Path</span><strong id="critical-len"></strong></div>
      <div class="stat"><span>Parallelism</span><strong id="parallelism"></strong></div>

      <div class="stat"><span>Leaf Targets</span><strong id="leaves"></strong></div>

    <main class="graph-wrap">

        <div><span class="chip" style="background:#f59e0b;"></span>Bottleneck</div>
        <div><span class="chip" style="background:#3b82f6;"></span>Other target</div>
      </div>
      <svg id="graph">

            <polygon points="0 0, 8 3.5, 0 7" fill="#94a3b8"></polygon>
          </marker>
        </defs>
        <g id="viewport"></g>
      </svg>
    </main>

    let panY = 0;

    let dragStart = null;

    const applyTransform = () => {
      viewport.setAttribute("transform", `translate(${panX}, ${panY}) scale(${scale})`);
    };

    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      const delta = event.deltaY < 0 ? 1.08 : 0.92;
      scale = Math.min(3, Math.max(0.35, scale * delta));
      applyTransform();
    });

    svg.addEventListener("mousedown", (event) => {
      dragging = true;

      svg.classList.add("dragging");
    });

    window.addEventListener("mousemove", (event) => {

      panX += (event.clientX - dragStart.x);
      panY += (event.clientY - dragStart.y);
      dragStart = { x: event.clientX, y: event.clientY };
      applyTransform();
    });

    window.addEventListener("mouseup", () => {
      dragging = false;
      dragStart = null;
      svg.classList.remove("dragging");
    });
